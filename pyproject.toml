[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runrepo"
version = "0.1.0"
description = "Deterministic repository analyzer and local runner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
runrepo = "runrepo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/runrepo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
